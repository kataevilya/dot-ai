<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>точка — ИИ-ассистент</title>
    
    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подсветка кода -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <!-- Поддержка математических формул (MathJax) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-main: #0b0b0b;
            --bg-sidebar: #080808;
            --bg-surface: #141414;
            --bg-user-bubble: #181818;
            --bg-hover: #1c1c1c;
            --bg-active: #202020;
            --border-subtle: #1e1e1e;
            --border-input: #262626;
            --text-primary: #f0f0f0;
            --text-secondary: #9a9a9a;
            --text-muted: #5e5e5e;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        /* ================= БОКОВАЯ ПАНЕЛЬ ================= */
        .sidebar {
            width: 268px;
            min-width: 268px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 12px;
            user-select: none;
            transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
        }

        .sidebar.collapsed {
            margin-left: -268px;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px 14px 6px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--accent);
            cursor: pointer;
        }

        .brand-square {
            width: 13px;
            height: 13px;
            background-color: #ffffff;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .btn-new-chat {
            background: transparent;
            border: 1px solid var(--border-input);
            color: var(--text-primary);
            padding: 9px 12px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s;
            margin-bottom: 8px;
        }

        .btn-new-chat:hover {
            background: var(--bg-surface);
            border-color: #333;
        }

        .btn-new-chat-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .shortcut-badge {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 12px;
        }

        .search-wrapper svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 8px 10px 8px 34px;
            color: var(--text-primary);
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            transition: background 0.15s;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-input:focus {
            background: var(--bg-surface);
        }

        /* История чатов */
        .history-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 2px;
        }

        .history-empty-hint {
            padding: 24px 12px;
            font-size: 12.5px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        .history-group-label {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 14px 10px 6px 10px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13.5px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .history-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .history-item.active {
            background: var(--bg-active);
            color: var(--text-primary);
            font-weight: 500;
        }

        .history-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            padding-right: 8px;
        }

        .history-item-delete {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            transition: opacity 0.15s, color 0.15s;
        }

        .history-item:hover .history-item-delete,
        .history-item.active .history-item-delete {
            opacity: 1;
        }

        .history-item-delete:hover {
            color: #ff5c5c;
        }

        /* Нижняя часть сайдбара */
        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 8px;
        }

        .sidebar-divider {
            height: 1px;
            background: var(--border-subtle);
            margin: 2px 0;
        }

        .user-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-radius: 9px;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .user-card:hover {
            background: var(--bg-hover);
        }

        .user-card-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1f1f1f;
            border: 1px solid #2e2e2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .user-name {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-sub {
            font-size: 11.5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Выпадающее меню профиля */
        .profile-dropdown {
            position: absolute;
            bottom: 56px;
            left: 8px;
            right: 8px;
            background: #161616;
            border: 1px solid var(--border-input);
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 50;
        }

        .profile-dropdown.open {
            display: flex;
        }

        .dropdown-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary);
            background: transparent;
            border: none;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover {
            background: var(--bg-hover);
        }

        .dropdown-item.danger {
            color: #ff6b6b;
        }

        /* ================= ОСНОВНАЯ ОБЛАСТЬ ================= */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            min-width: 0;
            position: relative;
        }

        .top-navbar {
            height: 54px;
            border-bottom: 1px solid var(--border-subtle);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-picker {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 7px;
            font-family: inherit;
        }

        .model-select-native {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .model-select-native option {
            background: #161616;
            color: var(--text-primary);
        }

        .nav-center {
            font-size: 13.5px;
            color: var(--text-secondary);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 420px;
            text-align: center;
        }

        .nav-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Поток сообщений */
        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-column {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .date-divider {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Приветственный экран */
        .empty-state {
            margin: auto 0;
            padding: 60px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .empty-logo {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: #161616;
            border: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .empty-state h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 420px;
            line-height: 1.5;
        }

        .starter-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
            max-width: 600px;
        }

        .starter-chip {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .starter-chip:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: #333;
        }

        /* Сообщение пользователя */
        .msg-user-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 28px;
        }

        .msg-user-bubble {
            background-color: var(--bg-user-bubble);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 13px 18px;
            border-radius: 14px;
            max-width: 78%;
            font-size: 14.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Сообщение ИИ (Точка) */
        .msg-ai-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 32px;
            width: 100%;
        }

        .msg-ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .msg-ai-dot {
            width: 9px;
            height: 9px;
            background: #ffffff;
            border-radius: 2px;
        }

        .msg-ai-body {
            font-size: 15px;
            line-height: 1.65;
            color: #d8d8d8;
            word-break: break-word;
        }

        .msg-ai-body h1,
        .msg-ai-body h2,
        .msg-ai-body h3 {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 18px 0 10px 0;
            line-height: 1.3;
        }

        .msg-ai-body h1:first-child,
        .msg-ai-body h2:first-child,
        .msg-ai-body h3:first-child {
            margin-top: 0;
        }

        .msg-ai-body h1 { font-size: 22px; }
        .msg-ai-body h2 { font-size: 19px; }
        .msg-ai-body h3 { font-size: 16px; }

        .msg-ai-body p {
            margin-bottom: 14px;
        }

        .msg-ai-body ul, .msg-ai-body ol {
            margin: 10px 0 16px 22px;
        }

        .msg-ai-body li {
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .msg-ai-body hr {
            border: none;
            border-top: 1px solid var(--border-subtle);
            margin: 16px 0;
        }

        .msg-ai-body strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* Блоки кода */
        .code-block-wrapper {
            background: #070707;
            border: 1px solid var(--border-input);
            border-radius: 10px;
            margin: 14px 0;
            overflow: hidden;
        }

        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 14px;
            background: #121212;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 12px;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .btn-copy-code {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-copy-code:hover {
            color: #fff;
        }

        .msg-ai-body pre {
            padding: 14px;
            overflow-x: auto;
            margin: 0;
            background: transparent !important;
        }

        .msg-ai-body code {
            font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
            font-size: 13.5px;
            background: rgba(255,255,255,0.07);
            padding: 2px 6px;
            border-radius: 5px;
        }

        .msg-ai-body pre code {
            background: transparent;
            padding: 0;
        }

        /* Блок размышлений <think> */
        .thinking-box {
            background: #111111;
            border: 1px solid var(--border-subtle);
            border-radius: 9px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .thinking-toggle {
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .thinking-content {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
            white-space: pre-wrap;
            font-size: 12.5px;
            color: #777;
        }

        /* Кнопки действий под ответом ИИ */
        .msg-ai-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .action-icon-btn:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
        }

        .action-icon-btn.liked {
            color: #fff;
        }

        /* ================= ПАНЕЛЬ ВВОДА ================= */
        .composer-section {
            padding: 8px 24px 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, rgba(11,11,11,0) 0%, var(--bg-main) 25%);
            flex-shrink: 0;
        }

        .composer-box {
            width: 100%;
            max-width: 720px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-input);
            border-radius: 16px;
            padding: 14px 16px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.15s;
        }

        .composer-box:focus-within {
            border-color: #383838;
        }

        .composer-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14.5px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 26px;
            max-height: 180px;
            line-height: 1.5;
        }

        .composer-textarea::placeholder {
            color: var(--text-muted);
        }

        .composer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-attach {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: color 0.15s;
        }

        .btn-attach:hover {
            color: var(--text-primary);
        }

        .composer-right-tools {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-mic {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }

        .btn-mic:hover {
            color: var(--text-primary);
        }

        .btn-submit {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #ffffff;
            color: #000000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            background: #2a2a2a;
            color: #5e5e5e;
            cursor: not-allowed;
        }

        .composer-footer-hints {
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 11.5px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        /* ================= МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ FIREBASE ================= */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .auth-card {
            width: 100%;
            max-width: 390px;
            background: #121212;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .auth-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .auth-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .auth-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .btn-google {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 11px 16px;
            border-radius: 10px;

        .auth-error {

        .auth-switch {

        /* Уведомление (Toast) */

        @media (max-width: 768px) {

</head>

    <!-- Подсветка кода -->

    <!-- Основная логика -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile,
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDocs, 
            deleteDoc, 
            query, 
            where 
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        import { client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";
        import { marked } from "https://cdn.jsdelivr.net/npm/marked/+esm";

        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBxWhSwY0CnzNJDpDv3t93r-ES87VNpHNA",
            authDomain: "mios-d93a0.firebaseapp.com",
            projectId: "mios-d93a0",
            storageBucket: "mios-d93a0.firebasestorage.app",
            messagingSenderId: "243827096220",
            appId: "1:243827096220:web:852a55c81570c831134b59",
            measurementId: "G-CCEP9R9LPD"
        };

        const app = initializeApp(firebaseConfig);
        try { getAnalytics(app); } catch (e) {}
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Жестко привязанный бэкенд без лимитов
        const HF_BACKEND_SPACE = "ryzik3489/aimodels";[cite: 1]

        let currentUser = null;
        let chats = [];
        let activeChatId = null;
        let isRegisterMode = false;
        let attachedFileContent = "";
        let attachedFileName = "";

        const renderer = new marked.Renderer();
        renderer.code = function(codeObjOrText, lang) {
            const codeText = typeof codeObjOrText === 'object' ? codeObjOrText.text : codeObjOrText;
            const language = (typeof codeObjOrText === 'object' ? codeObjOrText.lang : lang) || 'code';
            const escaped = codeText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return `
                <div class="code-block-wrapper">
                    <div class="code-block-header">
                        <span>${language}</span>
                        <button class="btn-copy-code" onclick="copyCodeBlock(this)">Копировать</button>
                    </div>
                    <pre><code class="language-${language}">${escaped}</code></pre>
                </div>
            `;
        };
        marked.setOptions({ renderer, breaks: true });

        function cleanLegacyDemoChat(list) {
            return list.filter(c => c.id !== "demo-launch-plan" && Array.isArray(c.messages) && c.messages.length > 0);
        }

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            updateUserProfileUI();
            await loadUserChats();
        });

        function updateUserProfileUI() {
            const avatarEl = document.getElementById('userAvatar');
            const nameEl = document.getElementById('userName');
            const subEl = document.getElementById('userSub');
            const loginBtn = document.getElementById('btnLoginAction');
            const logoutBtn = document.getElementById('btnLogoutAction');

            if (currentUser) {
                const displayName = currentUser.displayName || currentUser.email.split('@')[0];
                const initials = displayName.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();
                if (currentUser.photoURL) {
                    avatarEl.innerHTML = `<img src="${currentUser.photoURL}" alt="avatar">`;
                } else {
                    avatarEl.textContent = initials || 'АК';
                }
                nameEl.textContent = displayName;
                subEl.textContent = "Личное пространство";
                loginBtn.style.display = "none";
                logoutBtn.style.display = "flex";
            } else {
                avatarEl.textContent = "Г";
                nameEl.textContent = "Гость";
                subEl.textContent = "Личное пространство";
                loginBtn.style.display = "flex";
                logoutBtn.style.display = "none";
            }
        }

        function getLocalStorageKey() {
            return currentUser ? `tochka_chats_${currentUser.uid}` : `tochka_chats_guest`;
        }

        async function loadUserChats() {
            let loadedChats = [];
            try {
                const localRaw = localStorage.getItem(getLocalStorageKey());
                if (localRaw) {
                    loadedChats = cleanLegacyDemoChat(JSON.parse(localRaw));
                }
            } catch (e) {}

            if (currentUser) {
                try {
                    const q = query(collection(db, "tochka_chats"), where("uid", "==", currentUser.uid));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        const cloudChats = [];
                        snap.forEach(docSnap => cloudChats.push(docSnap.data()));
                        cloudChats.sort((a, b) => b.updatedAt - a.updatedAt);
                        loadedChats = cleanLegacyDemoChat(cloudChats);
                    }
                } catch (err) {}
            }

            chats = loadedChats;
            localStorage.setItem(getLocalStorageKey(), JSON.stringify(chats));
            activeChatId = chats.length > 0 ? chats[0].id : null;
            renderChatList();
            renderActiveChat();
        }

        async function saveChatsToStorage(updatedChat = null) {
            try {
                localStorage.setItem(getLocalStorageKey(), JSON.stringify(chats));
            } catch (e) {}

            if (currentUser && updatedChat) {
                try {
                    await setDoc(doc(db, "tochka_chats", `${currentUser.uid}_${updatedChat.id}`), {
                        ...updatedChat,
                        uid: currentUser.uid
                    });
                } catch (err) {}
            }
        }

        window.renderChatList = function() {
            const container = document.getElementById('historyContainer');
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            container.innerHTML = '';

            const validChats = chats.filter(c => c.messages && c.messages.length > 0);
            if (validChats.length === 0) {
                container.innerHTML = `<div class="history-empty-hint">История чатов пуста.<br>Напишите первое сообщение.</div>`;
                return;
            }

            const filtered = validChats.filter(c => c.title.toLowerCase().includes(searchQuery));
            if (filtered.length === 0) {
                container.innerHTML = `<div class="history-empty-hint">Ничего не найдено</div>`;
                return;
            }

            const now = Date.now();
            const oneDay = 86400000;
            const groups = { "Сегодня": [], "Вчера": [], "Предыдущие 7 дней": [] };

            filtered.forEach(chat => {
                const diff = now - (chat.updatedAt || now);
                if (diff < oneDay) groups["Сегодня"].push(chat);
                else if (diff < oneDay * 2) groups["Вчера"].push(chat);
                else groups["Предыдущие 7 дней"].push(chat);
            });

            Object.entries(groups).forEach(([groupName, groupChats]) => {
                if (groupChats.length === 0) return;
                const label = document.createElement('div');
                label.className = 'history-group-label';
                label.textContent = groupName;
                container.appendChild(label);

                groupChats.forEach(chat => {
                    const item = document.createElement('div');
                    item.className = `history-item ${chat.id === activeChatId ? 'active' : ''}`;
                    item.onclick = () => selectChat(chat.id);

                    item.innerHTML = `
                        <span class="history-item-title">${escapeHtml(chat.title)}</span>
                        <button class="history-item-delete" onclick="deleteChatById(event, '${chat.id}')" title="Удалить">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="19" cy="12" r="1"></circle>
                                <circle cx="5" cy="12" r="1"></circle>
                            </svg>
                        </button>
                    `;
                    container.appendChild(item);
                });
            });
        };

        window.selectChat = function(chatId) {
            activeChatId = chatId;
            renderChatList();
            renderActiveChat();
        };

        window.startFreshView = function() {
            activeChatId = null;
            renderChatList();
            renderActiveChat();
            document.getElementById('promptInput').focus();
        };

        window.deleteChatById = async function(event, chatId) {
            event.stopPropagation();
            chats = chats.filter(c => c.id !== chatId);
            if (currentUser) {
                try {
                    await deleteDoc(doc(db, "tochka_chats", `${currentUser.uid}_${chatId}`));
                } catch (e) {}
            }
            if (activeChatId === chatId) {
                activeChatId = chats.length > 0 ? chats[0].id : null;
            }
            saveChatsToStorage();
            renderChatList();
            renderActiveChat();
        };

        window.deleteCurrentChat = function() {
            if (!activeChatId) return;
            deleteChatById(new Event('click'), activeChatId);
        };

        window.clearAllHistory = function() {
            chats = [];
            activeChatId = null;
            localStorage.removeItem(getLocalStorageKey());
            renderChatList();
            renderActiveChat();
            showToast("История чатов очищена");
        };

        function renderActiveChat() {
            const column = document.getElementById('chatColumn');
            const headerTitle = document.getElementById('currentChatHeaderTitle');
            const currentChat = chats.find(c => c.id === activeChatId);

            column.innerHTML = '';

            if (!currentChat || currentChat.messages.length === 0) {
                headerTitle.textContent = "Новый чат";
                column.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-logo">
                            <div class="brand-square"></div>
                        </div>
                        <h1>Чем я могу помочь?</h1>
                        <p>Задайте вопрос, попросите написать код или составить структуру проекта.</p>
                        <div class="starter-prompts">
                            <button class="starter-chip" onclick="useStarterPrompt('Напиши чистый однофайловый сайт портфолио на HTML и CSS')">Сайт-портфолио на HTML</button>
                            <button class="starter-chip" onclick="useStarterPrompt('Помоги составить план запуска приложения на две недели')">План запуска продукта</button>
                            <button class="starter-chip" onclick="useStarterPrompt('Напиши скрипт парсера или телеграм-бота на Python')">Скрипт на Python</button>
                        </div>
                    </div>
                `;
                return;
            }

            headerTitle.textContent = currentChat.title;

            const dateDiv = document.createElement('div');
            dateDiv.className = 'date-divider';
            dateDiv.textContent = currentChat.messages[0]?.timestamp || 'Сегодня';
            column.appendChild(dateDiv);

            currentChat.messages.forEach((msg, index) => {
                if (msg.role === 'user') {
                    const userRow = document.createElement('div');
                    userRow.className = 'msg-user-row';
                    userRow.innerHTML = `<div class="msg-user-bubble">${escapeHtml(msg.content)}</div>`;
                    column.appendChild(userRow);
                } else {
                    const aiRow = createAiMessageElement(msg.content, index);
                    column.appendChild(aiRow);
                }
            });

            highlightAndTypeset(column);
            scrollToBottom();
        }

        function createAiMessageElement(rawContent, msgIndex) {
            const aiRow = document.createElement('div');
            aiRow.className = 'msg-ai-row';
            aiRow.innerHTML = `
                <div class="msg-ai-header">
                    <div class="msg-ai-dot"></div>
                    <span>Точка</span>
                </div>
                <div class="msg-ai-body">${formatAiMarkdown(rawContent)}</div>
                <div class="msg-ai-actions">
                    <button class="action-icon-btn" onclick="copyAiMessage(${msgIndex})" title="Скопировать ответ">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button class="action-icon-btn" onclick="this.classList.toggle('liked'); showToast('Спасибо за оценку!')" title="Хороший ответ">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
                        </svg>
                    </button>
                    <button class="action-icon-btn" onclick="showToast('Отзыв отправлен')" title="Плохой ответ">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path>
                        </svg>
                    </button>
                    <button class="action-icon-btn" onclick="regenerateResponse(${msgIndex})" title="Перегенерировать">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                </div>
            `;
            return aiRow;
        }

        function formatAiMarkdown(rawText) {
            if (!rawText) return '<span style="color:var(--text-muted);">Думаю...</span>';
            let processed = rawText;
            if (processed.includes('<think>')) {
                processed = processed.replace(
                    /<think>([\s\S]*?)<\/think>/g,
                    '<div class="thinking-box"><div class="thinking-toggle" onclick="const c=this.nextElementSibling; c.style.display=c.style.display===\'none\'?\'block\':\'none\';">🧠 Процесс рассуждения</div><div class="thinking-content">$1</div></div>'
                );
            }
            return marked.parse(processed);
        }

        function highlightAndTypeset(container) {
            container.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([container]).catch(() => {});
            }
        }

        async function connectToGradioWithRetry(spaceName, statusCallback) {
            const maxAttempts = 4;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                    if (attempt > 1) {
                        statusCallback(`⏳ Сервер **${spaceName}** просыпается или загружает модель (попытка ${attempt}/${maxAttempts})... Подождите пару секунд.`);
                    }
                    const appClient = await client(spaceName);
                    return appClient;
                } catch (err) {
                    const msg = String(err.message || err);
                    const is503 = msg.includes("503") || msg.includes("Could not resolve app config");
                    if (is503 && attempt < maxAttempts) {
                        await new Promise(r => setTimeout(r, 4500));
                        continue;
                    }
                    throw err;
                }
            }
        }

        window.sendMessage = async function(overridePrompt = null) {
            const input = document.getElementById('promptInput');
            const sendBtn = document.getElementById('sendBtn');
            const modelType = document.getElementById('modelSelect').value;

            let userText = overridePrompt !== null ? overridePrompt : input.value.trim();
            if (!userText && !attachedFileContent) return;

            if (attachedFileContent) {
                userText += `\n\n[Прикрепленный файл: ${attachedFileName}]\n\`\`\`\n${attachedFileContent}\n\`\`\``;
                attachedFileContent = "";
                attachedFileName = "";
                document.getElementById('attachLabel').textContent = "Добавить файл";
            }

            let currentChat = chats.find(c => c.id === activeChatId);
            if (!currentChat) {
                currentChat = {
                    id: "chat_" + Date.now(),
                    title: userText.slice(0, 38) + (userText.length > 38 ? "..." : ""),
                    updatedAt: Date.now(),
                    messages: []
                };
                chats.unshift(currentChat);
                activeChatId = currentChat.id;
            } else if (currentChat.messages.length === 0 || currentChat.title === "Новый чат") {
                currentChat.title = userText.slice(0, 38) + (userText.length > 38 ? "..." : "");
            }

            const nowTime = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            currentChat.messages.push({
                role: "user",
                content: userText,
                timestamp: `Сегодня, ${nowTime}`
            });

            const aiMessageObj = { role: "ai", content: "Подключение к серверу Точка..." };
            currentChat.messages.push(aiMessageObj);
            currentChat.updatedAt = Date.now();

            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            renderChatList();
            renderActiveChat();

            const column = document.getElementById('chatColumn');
            const aiBodies = column.querySelectorAll('.msg-ai-body');
            const targetAiBody = aiBodies[aiBodies.length - 1];

            try {
                const hfApp = await connectToGradioWithRetry(HF_BACKEND_SPACE, (statusText) => {
                    aiMessageObj.content = statusText;
                    targetAiBody.innerHTML = formatAiMarkdown(aiMessageObj.content);
                });

                const job = hfApp.submit("/predict", [userText, modelType]);

                for await (const message of job) {
                    if (message.type === "data" && message.data && message.data[0] !== undefined) {
                        aiMessageObj.content = message.data[0];
                        targetAiBody.innerHTML = formatAiMarkdown(aiMessageObj.content);
                        highlightAndTypeset(targetAiBody);
                        scrollToBottom();
                    }
                }
            } catch (error) {
                const errText = String(error.message || error);
                if (errText.includes("503") || errText.includes("Could not resolve app config")) {
                    aiMessageObj.content = `⏳ **Сервер сейчас запускается (Код 503).**\n\nКонтейнер на Hugging Face просыпается или загружает модель. Подождите 1 минуту и нажмите кнопку **Перегенерировать** (🔄) ниже.`;
                } else {
                    aiMessageObj.content = `⚠️ **Ошибка соединения**:\n\`${errText}\``;
                }
                targetAiBody.innerHTML = formatAiMarkdown(aiMessageObj.content);
            } finally {
                sendBtn.disabled = false;
                saveChatsToStorage(currentChat);
            }
        };

        window.useStarterPrompt = function(text) {
            const input = document.getElementById('promptInput');
            input.value = text;
            sendMessage();
        };

        window.regenerateResponse = function(msgIndex) {
            const currentChat = chats.find(c => c.id === activeChatId);
            if (!currentChat) return;
            const prevUserMsg = currentChat.messages[msgIndex - 1];
            if (!prevUserMsg || prevUserMsg.role !== 'user') return;
            currentChat.messages.splice(msgIndex - 1, 2);
            sendMessage(prevUserMsg.content);
        };

        window.copyAiMessage = function(msgIndex) {
            const currentChat = chats.find(c => c.id === activeChatId);
            if (!currentChat || !currentChat.messages[msgIndex]) return;
            navigator.clipboard.writeText(currentChat.messages[msgIndex].content);
            showToast("Ответ скопирован");
        };

        window.copyCodeBlock = function(btn) {
            const pre = btn.closest('.code-block-wrapper').querySelector('pre code');
            navigator.clipboard.writeText(pre.innerText);
            btn.textContent = "Скопировано!";
            setTimeout(() => btn.textContent = "Копировать", 1800);
        };

        window.openAuthModal = function() {
            document.getElementById('profileDropdown').classList.remove('open');
            document.getElementById('authErrorBox').textContent = '';
            document.getElementById('authModal').classList.add('active');
        };

        window.closeModalOnOutside = function(e, modalId) {
            if (e.target.id === modalId) {
                document.getElementById(modalId).classList.remove('active');
            }
        };

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authNameInput').style.display = isRegisterMode ? 'block' : 'none';
            document.getElementById('authModalTitle').textContent = isRegisterMode ? 'Регистрация аккаунта' : 'Вход в личное пространство';
            document.getElementById('authSubmitBtn').textContent = isRegisterMode ? 'Создать аккаунт' : 'Войти';
            document.getElementById('authSwitchText').textContent = isRegisterMode ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
            document.getElementById('authSwitchBtn').textContent = isRegisterMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('authErrorBox').textContent = '';
        };

        window.loginWithGoogle = async function() {
            const errBox = document.getElementById('authErrorBox');
            errBox.textContent = '';
            try {
                await signInWithPopup(auth, googleProvider);
                document.getElementById('authModal').classList.remove('active');
                showToast("Успешный вход через Google");
            } catch (err) {
                errBox.textContent = "Ошибка входа: " + err.message;
            }
        };

        window.handleEmailAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('authEmailInput').value.trim();
            const password = document.getElementById('authPasswordInput').value;
            const name = document.getElementById('authNameInput').value.trim();
            const errBox = document.getElementById('authErrorBox');
            errBox.textContent = '';

            try {
                if (isRegisterMode) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    if (name) {
                        await updateProfile(cred.user, { displayName: name });
                        updateUserProfileUI();
                    }
                    showToast("Аккаунт создан!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showToast("С возвращением!");
                }
                document.getElementById('authModal').classList.remove('active');
            } catch (err) {
                errBox.textContent = err.message;
            }
        };

        window.logoutUser = async function() {
            document.getElementById('profileDropdown').classList.remove('open');
            await signOut(auth);
            showToast("Вы вышли из аккаунта");
        };

        window.toggleSidebar = function() {
            const sb = document.getElementById('sidebar');
            const expandBtn = document.getElementById('btnExpandSidebar');
            sb.classList.toggle('collapsed');
            expandBtn.style.display = sb.classList.contains('collapsed') ? 'flex' : 'none';
        };

        window.toggleProfileDropdown = function(e) {
            e.stopPropagation();
            document.getElementById('profileDropdown').classList.toggle('open');
        };

        document.addEventListener('click', () => {
            document.getElementById('profileDropdown').classList.remove('open');
        });

        window.autoResizeTextarea = function(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 180) + 'px';
        };

        window.handleComposerKeydown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                startFreshView();
            }
        });

        window.handleFileSelect = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                attachedFileContent = ev.target.result.slice(0, 6000);
                attachedFileName = file.name;
                document.getElementById('attachLabel').textContent = file.name;
                showToast(`Файл ${file.name} прикреплен`);
            };
            reader.readAsText(file);
        };

        window.startVoiceInput = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("Голосовой ввод не поддерживается браузером");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.onstart = () => showToast("Говорите...");
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const input = document.getElementById('promptInput');
                input.value = (input.value + " " + transcript).trim();
                autoResizeTextarea(input);
            };
            recognition.start();
        };

        function scrollToBottom() {
            const scroller = document.getElementById('chatScroll');
            scroller.scrollTop = scroller.scrollHeight;
        }

        window.showToast = function(msg) {
            const toast = document.getElementById('toastBox');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2400);
        };

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
